<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Alyssa...</title>
<style>
  :root { box-sizing: border-box; }
  *, *::before, *::after { box-sizing: inherit; }

  html, body {
    margin: 0;
    height: 100%;
    background: #000;
    overflow: hidden;
  }

  body {
    display: grid;
    place-items: center;
    font-family: "Segoe UI", "Noto Sans", "Helvetica Neue", Arial, sans-serif;
  }

  /* Camada onde as frases do coração são posicionadas */
  #heart {
    position: fixed;
    inset: 0;
    pointer-events: none;
    user-select: none;
  }

  .w {
    position: absolute;
    white-space: nowrap;
    line-height: 1;
    transform: translateY(-50%);
    opacity: 0;
    transition: opacity 0.9s ease;
    text-shadow: 0 0 6px rgba(255, 30, 70, 0.35);
  }
  .w.on { opacity: var(--o, 1); }

  /* Botão central: sem fundo, margem curta ao redor do texto */
  #btn {
    position: relative;
    z-index: 2;
    background: none;
    padding: 0.3em 0.7em;
    margin: 0;
    color: #ff1744;
    font-family: Georgia, "Times New Roman", serif;
    font-size: clamp(1.1rem, 2.6vw, 1.7rem);
    letter-spacing: 0.04em;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    transition: border-color 0.3s ease, color 0.3s ease;
  }
  #btn:hover { border-color: #fff; }
  #btn:focus-visible { outline: 2px solid #ff5c7a; outline-offset: 4px; }

  @media (prefers-reduced-motion: reduce) {
    .w { transition-duration: 0.2s; }
  }
</style>
</head>
<body>

<div id="heart" aria-hidden="true"></div>
<button id="btn" type="button" aria-expanded="false">Alyssa...</button>

<script>
(() => {
  /* "Eu te amo" em várias línguas (o português aparece mais vezes) */
  const WORDS = [
    "Eu te amo", "Eu te amo", "Eu te amo",
    "Te amo", "Te quiero", "Je t'aime", "Ti amo", "Ich liebe dich", "I love you",
    "愛してる", "我爱你", "사랑해", "Я тебя люблю", "Σ' αγαπώ",
    "أحبك", "אני אוהב אותך", "मैं तुमसे प्यार करता हूँ", "Seni seviyorum",
    "Jag älskar dig", "Jeg elsker deg", "Jeg elsker dig", "Ik hou van jou",
    "Kocham cię", "Aku cinta kamu", "Anh yêu em", "Mahal kita", "Te iubesc",
    "Szeretlek", "Rakastan sinua", "Miluji tě", "Volim te", "Обичам те",
    "Я тебе кохаю", "T'estimo", "Ég elska þig", "Aš tave myliu", "Mīlu tevi",
    "Armastan sind", "Ninakupenda", "Ngiyakuthanda", "Mən səni sevirəm",
    "ฉันรักเธอ", "আমি তোমাকে ভালোবাসি", "Tá grá agam duit", "Mi amas vin",
    "Te dua", "Maite zaitut", "Rwy'n dy garu di", "دوستت دارم",
    "مجھے تم سے محبت ہے", "მიყვარხარ", "Ես քեզ սիրում եմ"
  ];

  const FONT = '"Segoe UI","Noto Sans","Helvetica Neue",Arial,sans-serif';
  const COLORS = ["#ff1744", "#ff4d6d", "#e11d48", "#ff7a90", "#ff2e63", "#f43f5e", "#ff9aa9"];
  const SIZES = [0.86, 1, 1, 1.14];
  const WEIGHTS = [400, 400, 600];

  const layer = document.getElementById("heart");
  const btn = document.getElementById("btn");
  const ctx = document.createElement("canvas").getContext("2d");
  const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;

  /* Contorno do coração (curva paramétrica clássica), em coordenadas matemáticas */
  const POLY = [];
  for (let i = 0; i < 720; i++) {
    const t = (i / 720) * Math.PI * 2;
    POLY.push([
      16 * Math.sin(t) ** 3,
      13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t)
    ]);
  }

  /* Gerador pseudoaleatório com semente: o layout é o mesmo a cada redimensionamento */
  function mulberry32(a) {
    return () => {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  /* Intervalos horizontais dentro do coração numa linha y */
  function spans(y, P) {
    const xs = [];
    for (let i = 0; i < P.length; i++) {
      const [x1, y1] = P[i], [x2, y2] = P[(i + 1) % P.length];
      if ((y1 <= y && y2 > y) || (y2 <= y && y1 > y)) {
        xs.push(x1 + ((y - y1) * (x2 - x1)) / (y2 - y1));
      }
    }
    xs.sort((a, b) => a - b);
    const r = [];
    for (let i = 0; i + 1 < xs.length; i += 2) r.push([xs[i], xs[i + 1]]);
    return r;
  }
  function intersect(A, B) {
    const r = [];
    for (const a of A) for (const b of B) {
      const l = Math.max(a[0], b[0]), h = Math.min(a[1], b[1]);
      if (h - l > 0) r.push([l, h]);
    }
    return r;
  }
  function subtract(A, z) {
    const r = [];
    for (const a of A) {
      if (z[1] <= a[0] || z[0] >= a[1]) { r.push(a); continue; }
      if (z[0] > a[0]) r.push([a[0], z[0]]);
      if (z[1] < a[1]) r.push([z[1], a[1]]);
    }
    return r;
  }

  let order = [];   // elementos do mais externo (borda) ao mais interno (centro)
  let open = false;
  let timers = [];
  let step = 40;

  function clearTimers() { timers.forEach(clearTimeout); timers = []; }

  function build() {
    clearTimers();
    layer.textContent = "";
    order = [];

    const rnd = mulberry32(2026);
    const W = innerWidth, H = innerHeight;
    const s = Math.min((W * 0.96) / 32, (H * 0.94) / 29);
    const P = POLY.map(([x, y]) => [W / 2 + x * s, H / 2 - (y + 2.5) * s]);

    const top = H / 2 - 14.5 * s, bottom = H / 2 + 14.5 * s;
    const rowCount = Math.max(8, Math.floor((bottom - top) / Math.max((bottom - top) / 28, 13)));
    const rowH = (bottom - top) / rowCount;
    const baseFs = rowH * 0.72;
    const minGap = Math.max(6, rowH * 0.5);

    // Área reservada em volta do botão central
    const b = btn.getBoundingClientRect();
    const zoneX = [b.left - 10, b.right + 10];
    const zoneY = [b.top - rowH * 0.35, b.bottom + rowH * 0.35];

    const measure = (t, fs, wt) => {
      ctx.font = `${wt} ${fs}px ${FONT}`;
      return ctx.measureText(t).width + 1;
    };

    const placed = [];

    for (let r = 0; r < rowCount; r++) {
      const yc = top + (r + 0.5) * rowH;
      const y1 = yc - rowH * 0.4, y2 = yc + rowH * 0.4;
      let intervals = intersect(intersect(spans(y1, P), spans(yc, P)), spans(y2, P));
      if (y2 > zoneY[0] && y1 < zoneY[1]) intervals = subtract(intervals, zoneX);

      for (const [a0, b0] of intervals) {
        const a = a0 + 3, width = b0 - a0 - 6;
        if (width < baseFs * 4) continue;

        // Sorteia frases até preencher a linha
        const items = [];
        let used = 0, fails = 0;
        while (fails < 14) {
          const t = WORDS[(rnd() * WORDS.length) | 0];
          const fs = baseFs * SIZES[(rnd() * SIZES.length) | 0];
          const wt = WEIGHTS[(rnd() * WEIGHTS.length) | 0];
          const w = measure(t, fs, wt);
          if (used + w + items.length * minGap <= width) { items.push({ t, fs, wt, w }); used += w; }
          else fails++;
        }
        if (!items.length) continue;

        let x = a;
        let gap = 0;
        if (items.length === 1) x = a + (width - items[0].w) / 2;
        else gap = (width - used) / (items.length - 1);

        for (const it of items) {
          const el = document.createElement("span");
          el.className = "w";
          el.textContent = it.t;
          el.style.left = x.toFixed(1) + "px";
          el.style.top = yc.toFixed(1) + "px";
          el.style.fontSize = it.fs.toFixed(1) + "px";
          el.style.fontWeight = it.wt;
          el.style.color = COLORS[(rnd() * COLORS.length) | 0];
          el.style.setProperty("--o", (0.72 + rnd() * 0.28).toFixed(2));
          if (open) el.classList.add("on");
          layer.appendChild(el);
          placed.push({ el, cx: x + it.w / 2, cy: yc, jitter: (rnd() - 0.5) * rowH * 1.4 });
          x += it.w + gap;
        }
      }
    }

    // Profundidade = distância até a borda do coração; borda primeiro, centro por último
    for (const p of placed) {
      let d = Infinity;
      for (const [px, py] of P) {
        const dd = (px - p.cx) ** 2 + (py - p.cy) ** 2;
        if (dd < d) d = dd;
      }
      p.depth = Math.sqrt(d) + p.jitter;
    }
    placed.sort((m, n) => m.depth - n.depth);
    order = placed.map(p => p.el);

    const total = reduceMotion ? 300 : 4800;
    step = Math.min(70, total / Math.max(order.length, 1));
  }

  /* show = true: fade-in da borda para o centro; false: fade-out do centro para a borda */
  function run(show) {
    clearTimers();
    open = show;
    btn.setAttribute("aria-expanded", String(show));
    const list = show ? order : [...order].reverse();
    let i = 0;
    for (const el of list) {
      if (el.classList.contains("on") === show) continue;
      timers.push(setTimeout(() => el.classList.toggle("on", show), i * step));
      i++;
    }
  }

  btn.addEventListener("click", () => run(!open));

  let resizeTimer;
  addEventListener("resize", () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(build, 120);
  });

  (document.fonts ? document.fonts.ready : Promise.resolve()).then(build);
})();
</script>
</body>
</html>
